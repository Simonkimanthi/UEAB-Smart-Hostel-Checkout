{% extends "base.html" %}

{% block title %}Invalid Request{% endblock %}

{% block content %}
<main class="error-page" aria-labelledby="error-heading">
    <span class="eyebrow">400 ERROR</span>

    <h1 id="error-heading">Request could not be completed</h1>

    <p>
        {{ error_description or "The request contains invalid or expired information." }}
    </p>

    <a class="btn btn-primary" href="{{ url_for('index') }}">
        Return home
    </a>
</main>
{% endblock %}
